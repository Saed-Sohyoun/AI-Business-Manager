[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app", "tests", "scripts"]

[tool.ruff.lint]
# Correctness-focused; avoid noisy style churn across the whole tree.
select = ["E9", "F63", "F7", "F82", "F401", "F811", "F821", "F822", "F823", "F841"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F401"]
